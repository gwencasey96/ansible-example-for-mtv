---
# PostHook example: runs after migration completes.
# This example does not touch networking; it only loads MTV metadata and logs success.

- name: PostHook - Load MTV metadata and report success
  hosts: localhost
  gather_facts: yes
  tasks:
    - name: Load migration Plan metadata
      include_vars:
        file: plan.yml
        name: plan
      ignore_errors: yes
      failed_when: false

    - name: Load VM workload metadata
      include_vars:
        file: workload.yml
        name: workload
      ignore_errors: yes
      failed_when: false

    - name: Log post hook success
      debug:
        msg: "Post hook ran successfully."
      run_once: true
