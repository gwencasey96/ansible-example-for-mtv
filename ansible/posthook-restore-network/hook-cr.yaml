---
# MTV Hook CR - PostHook example (logs success only, no networking)
#
# This posthook loads plan/workload metadata and prints "Post hook ran successfully."
# It does not SSH to the VM or change any network configuration.
#
# Encode the playbook before applying (if you edit playbook.yml):
#   cd ansible && ./scripts/encode-playbook.sh posthook-restore-network/playbook.yml
#
# Apply: kubectl apply -f hook-cr.yaml
#
# Reference in Plan:
#   spec:
#     vms:
#       - id: vm-123
#         hooks:
#           - hook: { name: restore-network, namespace: openshift-mtv }
#             step: PostHook
#
apiVersion: forklift.konveyor.io/v1beta1
kind: Hook
metadata:
  name: restore-network
  namespace: openshift-mtv
spec:
  image: quay.io/konveyor/hook-runner:latest
  # To regenerate: ./scripts/encode-playbook.sh posthook-restore-network/playbook.yml
  playbook: ""
  serviceAccount: forklift-controller
  deadline: 300
