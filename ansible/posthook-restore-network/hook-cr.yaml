---
# MTV Hook CR for restoring network state after migration (SSH-based)
#
# Prerequisite: Use the pre-hook "preserve-interface-names" so the VM has
# /root/.mtv-network-state.json when it lands on the target. This post-hook
# reads that file on the target VM and re-applies udev + NM state.
#
# Encode the playbook before applying:
#   cd ansible && ./scripts/encode-playbook.sh posthook-restore-network/playbook.yml
# Then paste the base64 output into spec.playbook below.
#
# Apply: kubectl apply -f hook-cr.yaml
#
# Reference in Plan:
#   spec:
#     vms:
#       - id: vm-123
#         hooks:
#           - hook: { name: preserve-interface-names, namespace: konveyor-forklift }
#             step: PreHook
#           - hook: { name: restore-network, namespace: konveyor-forklift }
#             step: PostHook
#
apiVersion: forklift.konveyor.io/v1beta1
kind: Hook
metadata:
  name: restore-network
  namespace: konveyor-forklift
spec:
  image: quay.io/konveyor/hook-runner:latest
  # To regenerate: ./scripts/encode-playbook.sh posthook-restore-network/playbook.yml
  playbook: 
  serviceAccount: forklift-controller
  deadline: 1800
