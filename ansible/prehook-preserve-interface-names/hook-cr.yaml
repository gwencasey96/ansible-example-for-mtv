---
# Hook CR for preserving network interface names
# This hook creates udev rules to ensure interface names remain consistent after migration
apiVersion: forklift.konveyor.io/v1beta1
kind: Hook
metadata:
  name: preserve-interface-names
  namespace: konveyor-forklift
spec:
  image: quay.io/konveyor/hook-runner:latest
  playbook: ""
  # Note: The playbook above is base64-encoded. To decode:
  # echo "<base64-string>" | base64 -d > playbook.yml
  # Or use the provided script: ansible/scripts/encode-playbook.sh
