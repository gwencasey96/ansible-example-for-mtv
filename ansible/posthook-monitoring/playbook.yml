---
# PostHook: Install node_exporter monitoring after migration completes
# This sets up Prometheus-compatible monitoring on the migrated VM

- name: PostHook - Setup SSH and load MTV metadata
  hosts: localhost
  gather_facts: yes
  vars:
    # IMPORTANT: The SSH secret must be in the namespace where the hook runs,
    # NOT in the target namespace. Hooks run in the MTV operator namespace
    # (typically 'konveyor-forklift' for upstream or 'openshift-mtv' for downstream).
    # 
    # To override the namespace, set ssh_secret_namespace variable when creating the Hook CR,
    # or modify this default value in the playbook before encoding.
    #
    # Example: If your secret is in 'mtv-test', set: ssh_secret_namespace: "mtv-test"
    ssh_secret_namespace: "{{ ssh_secret_namespace | default('konveyor-forklift') }}"
    ssh_secret_name: "{{ ssh_secret_name | default('vm-ssh-credentials') }}"
  tasks:
    - name: Load migration Plan metadata
      include_vars:
        file: plan.yml
        name: plan

    - name: Load VM workload metadata
      include_vars:
        file: workload.yml
        name: workload

    - name: Get current user info for SSH setup
      getent:
        database: passwd
        key: "{{ ansible_user_id }}"
        split: ':'

    - name: Ensure SSH directory exists
      file:
        path: ~/.ssh
        state: directory
        mode: 0750
      environment:
        HOME: "{{ ansible_facts.getent_passwd[ansible_user_id][4] }}"

    - name: Retrieve SSH credentials from Kubernetes Secret
      k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ ssh_secret_name }}"
        # NOTE: This namespace is where the hook runs (MTV operator namespace),
        # NOT the target namespace where VMs are migrated to.
        # The secret must exist in this namespace for the hook to access it.
        namespace: "{{ ssh_secret_namespace }}"
      register: ssh_credentials
      ignore_errors: yes
      failed_when: false

    - name: Validate SSH credentials were retrieved
      assert:
        that:
          - ssh_credentials is defined
          - ssh_credentials.resources is defined
          - ssh_credentials.resources | length > 0
          - ssh_credentials.resources[0].data is defined
          - ssh_credentials.resources[0].data.key is defined
        fail_msg: |
          Failed to retrieve SSH credentials from secret '{{ ssh_secret_name }}' in namespace '{{ ssh_secret_namespace }}'.
          
          IMPORTANT: The secret must be in the namespace where the hook runs ({{ ssh_secret_namespace }}),
          NOT in the target namespace where VMs are migrated to.
          
          Possible issues:
          1. Secret does not exist - Create it with: oc create secret generic {{ ssh_secret_name }} --from-file=key=/path/to/key -n {{ ssh_secret_namespace }}
          2. Secret is in a different namespace - Update ssh_secret_namespace variable in the playbook or Hook CR
          3. Secret does not contain a 'key' field - Ensure the secret has a 'key' field with base64-encoded SSH private key
          
          Current namespace being checked: {{ ssh_secret_namespace }}
          Secret name: {{ ssh_secret_name }}
        success_msg: "SSH credentials retrieved successfully from secret '{{ ssh_secret_name }}' in namespace '{{ ssh_secret_namespace }}'"

    - name: Create SSH private key file
      copy:
        dest: ~/.ssh/mtv_migration_key
        content: "{{ ssh_credentials.resources[0].data.key | b64decode }}"
        mode: 0600
      when:
        - ssh_credentials is defined
        - ssh_credentials.resources is defined
        - ssh_credentials.resources | length > 0
        - ssh_credentials.resources[0].data is defined
        - ssh_credentials.resources[0].data.key is defined

    - name: Add target VM to Ansible inventory
      add_host:
        name: "{{ workload.vm.ipaddress }}"
        ansible_user: root
        ansible_ssh_private_key_file: ~/.ssh/mtv_migration_key
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
        groups: target_vms

- name: Install monitoring on target VM
  hosts: target_vms
  gather_facts: yes
  vars:
    node_exporter_version: "1.7.0"
    node_exporter_port: 9100
  tasks:
    - name: Create node_exporter user
      user:
        name: node_exporter
        shell: /sbin/nologin
        system: yes
        create_home: no

    - name: Download node_exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp/node_exporter.tar.gz
        mode: 0644

    - name: Extract node_exporter
      unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp/
        remote_src: yes

    - name: Install node_exporter binary
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        owner: node_exporter
        group: node_exporter
        mode: 0755
        remote_src: yes

    - name: Create node_exporter systemd service
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          Documentation=https://prometheus.io/docs/guides/node-exporter/
          After=network-online.target
          
          [Service]
          Type=simple
          User=node_exporter
          Group=node_exporter
          ExecStart=/usr/local/bin/node_exporter \
            --web.listen-address=:{{ node_exporter_port }}
          
          SyslogIdentifier=node_exporter
          Restart=always
          RestartSec=5
          
          [Install]
          WantedBy=multi-user.target
        mode: 0644

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable and start node_exporter
      systemd:
        name: node_exporter
        state: started
        enabled: yes

    - name: Check if firewalld is installed
      command: systemctl is-active firewalld
      register: firewalld_status
      changed_when: false
      failed_when: false
      ignore_errors: yes

    - name: Open firewall port for node_exporter (firewalld) using firewall-cmd
      shell: |
        firewall-cmd --permanent --add-port={{ node_exporter_port }}/tcp
        firewall-cmd --reload
      when: 
        - firewalld_status.rc == 0
        - firewalld_status.stdout == "active"
      ignore_errors: yes
      failed_when: false

    - name: Check if ufw is installed
      command: systemctl is-active ufw
      register: ufw_status
      changed_when: false
      failed_when: false
      ignore_errors: yes

    - name: Open firewall port for node_exporter (ufw) using ufw command
      shell: ufw allow {{ node_exporter_port }}/tcp
      when: 
        - ufw_status.rc == 0
        - ufw_status.stdout == "active"
      ignore_errors: yes
      failed_when: false

    - name: Verify node_exporter is running
      uri:
        url: "http://localhost:{{ node_exporter_port }}/metrics"
        method: GET
        status_code: 200
      register: metrics_check
      retries: 3
      delay: 5
      until: metrics_check.status == 200

    - name: Log completion
      debug:
        msg: "node_exporter monitoring installed successfully on {{ inventory_hostname }}:{{ node_exporter_port }}"

